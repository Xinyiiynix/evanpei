
<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PEI FAMILY OFFICE | 裴氏家族资产终端</title><style>:root{font-family:Arial,'Microsoft YaHei',sans-serif;color:#e9e4d9;background:#0c0f13}*{box-sizing:border-box}body{margin:0}header{padding:24px 5%;border-bottom:1px solid #40382a;display:flex;justify-content:space-between;align-items:center}.brand{letter-spacing:3px;color:#d9bf89;font-size:14px}.sub{font-size:11px;color:#8c8b86;letter-spacing:2px;margin-top:8px}.shell{display:flex;min-height:calc(100vh - 86px)}nav{width:235px;border-right:1px solid #302c28;padding:28px 15px}button{cursor:pointer}nav button{display:block;width:100%;text-align:left;background:transparent;color:#a9a69d;border:0;padding:15px;border-radius:7px;margin-bottom:5px}nav button.active,nav button:hover{background:#24241f;color:#e6c993}main{padding:42px 5%;flex:1;max-width:1250px}h1{font-weight:400;font-size:28px}p{color:#a8a7a2}.eyebrow{font-size:11px;letter-spacing:3px;color:#c9ad79}.total{font-size:clamp(30px,5vw,52px);letter-spacing:1px;margin:16px 0}.positive{color:#94b7a0}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:32px}.card{border:1px solid #3c362e;background:#15181b;padding:25px;min-height:145px;border-radius:5px}.card small{color:#a6a29a}.card h2{font-size:21px;font-weight:400;color:#e7d5b5}.card p{font-size:13px;line-height:1.6}.footer{font-size:12px;margin-top:40px;color:#777}#lock{background:#181a1d;border:1px solid #50432f;padding:12px 18px;color:#d5b981;border-radius:5px}.notice{margin-top:20px;padding:12px;border:1px solid #51412d;color:#d4bc8c;display:none}@media(max-width:700px){header{padding:20px}.shell{display:block}nav{width:100%;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid #302c28;padding:8px}nav button{white-space:nowrap;width:auto;margin:0}main{padding:25px 20px}.cards{grid-template-columns:1fr}}

/* Entry sequence */
#entry{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at center,#171b20 0%,#080a0d 70%);display:grid;place-items:center;padding:22px;color:#d8c39c;transition:opacity .7s,visibility .7s}
#entry.hidden{opacity:0;visibility:hidden;pointer-events:none}
.entry-panel{width:min(440px,100%);border:1px solid #4a4033;padding:35px 30px;background:linear-gradient(150deg,#191b1e,#101215);box-shadow:0 30px 100px #000b;position:relative}
.entry-panel:before,.entry-panel:after{content:'';position:absolute;width:20px;height:20px;border-color:#a28a5f;border-style:solid}.entry-panel:before{top:-1px;left:-1px;border-width:1px 0 0 1px}.entry-panel:after{bottom:-1px;right:-1px;border-width:0 1px 1px 0}
.entry-mark{text-align:center;font-family:Georgia,serif;font-size:48px;letter-spacing:8px;margin-bottom:12px}.entry-kicker{text-align:center;font-size:10px;letter-spacing:4px;color:#b4a080}.entry-rule{height:1px;background:linear-gradient(90deg,transparent,#6e5c3c,transparent);margin:26px 0}.entry-title{font-size:19px;letter-spacing:3px;font-weight:400}.entry-desc{font-size:13px;line-height:2;color:#a8a39a;margin:20px 0 25px}.entry-actions{display:flex;gap:12px}.entry-actions button{flex:1;border:1px solid #65553b;background:transparent;color:#dbc79f;padding:13px;font-size:13px}.entry-actions button.primary{background:#a78b59;color:#111}.entry-actions button:hover{filter:brightness(1.2)}.entry-status{font-size:12px;letter-spacing:1px;color:#b5a17a;min-height:40px;margin-top:25px}.progress{height:2px;background:#292b2e;overflow:hidden;display:none}.progress span{display:block;width:0;height:100%;background:#d8bb7e;transition:width 3.3s linear}.scanline{height:1px;background:#d4b67b;box-shadow:0 0 18px #d4b67b;position:absolute;left:25px;right:25px;top:80px;opacity:0}.scanning .scanline{opacity:.8;animation:scan 2.1s ease-in-out infinite alternate}@keyframes scan{from{transform:translateY(0)}to{transform:translateY(235px)}}@media(prefers-reduced-motion:reduce){.scanning .scanline{animation:none}#entry{transition:none}.progress span{transition:none}}
</style></head><body><div id="entry" role="dialog" aria-modal="true" aria-labelledby="entry-title"><div class="entry-panel"><div class="scanline"></div><div class="entry-mark">P</div><div class="entry-kicker">PEI FAMILY OFFICE · PRIVATE TERMINAL</div><div class="entry-rule"></div><div class="entry-title" id="entry-title">授权申请 · AUTHORIZATION</div><div class="entry-desc" id="entry-desc">是否向裴氏家族办公室发送查看授权申请？<br>申请将通过私人终端进行模拟核验。</div><div class="entry-actions" id="entry-actions"><button id="entry-no">否 · CANCEL</button><button class="primary" id="entry-yes">是 · REQUEST</button></div><div class="entry-status" id="entry-status">SECURE CHANNEL · STANDBY</div><div class="progress" id="entry-progress"><span id="entry-bar"></span></div></div></div><header><div><div class="brand">PEI FAMILY OFFICE</div><div class="sub">PRIVATE WEALTH MANAGEMENT</div></div><button id="lock">安全终端</button></header><div class="shell"><nav id="nav"></nav><main><div class="eyebrow">CONFIDENTIAL · DEMONSTRATION</div><h1 id="heading"></h1><p id="description"></p><div id="content"></div><div class="notice" id="notice">这是用于故事创作的模拟安全界面，不会采集密码或生物识别信息。</div><div class="footer">© PEI FAMILY OFFICE · FICTIONAL DEMONSTRATION · 所有资产与机构均为虚构</div></main></div><script>
const pages=[{name:'资产总览',desc:'家族资产配置与季度表现',cards:[['集团控股','HK$ 68.7 B','核心产业及控股企业'],['全球不动产','HK$ 32.4 B','住宅、商业物业与庄园'],['证券及基金','HK$ 27.1 B','全球市场投资组合'],['私人收藏','HK$ 8.6 B','珠宝、艺术品与古董'],['私人信托','HK$ 12.0 B','家族长期财富安排'],['其他资产','HK$ 4.0 B','现金及其他权益']]},{name:'集团控股',desc:'核心企业及持股结构（虚构）',cards:[['裴氏控股','78%','家族核心控股平台'],['远洋投资','64%','国际产业投资'],['寰宇科技','51%','科技与基础设施']]},{name:'全球不动产',desc:'家族不动产登记摘要（虚构）',cards:[['香港','HK$ 12.8 B','商业及住宅资产'],['伦敦','HK$ 9.4 B','历史建筑及物业'],['新加坡','HK$ 10.2 B','综合物业投资']]},{name:'私人收藏',desc:'家族私人收藏目录（虚构）',cards:[['高级珠宝','HK$ 3.2 B','稀有宝石与定制珠宝'],['艺术藏品','HK$ 4.1 B','绘画与雕塑'],['珍稀腕表','HK$ 1.3 B','历史及现代腕表']]},{name:'交易档案',desc:'演示用交易记录',cards:[['2026-Q3','资产再平衡','全球投资组合调整'],['2026-Q2','新资产登记','伦敦物业组合'],['2026-Q1','收藏品入库','私人艺术品档案']]},{name:'安全中心',desc:'演示环境 · 不提供真实身份验证',cards:[['访问等级','DEMO','公开演示模式'],['安全策略','未启用','正式上线前需配置服务端认证'],['审计日志','演示数据','无真实访问记录']]}];let current=0;const nav=document.getElementById('nav');pages.forEach((p,i)=>{let b=document.createElement('button');b.textContent=p.name;b.onclick=()=>show(i);nav.appendChild(b)});function show(i){current=i;[...nav.children].forEach((b,j)=>b.classList.toggle('active',i===j));let p=pages[i];document.getElementById('heading').textContent=p.name;document.getElementById('description').textContent=p.desc;let content=document.getElementById('content');content.innerHTML='';if(i===0){let summary=document.createElement('div');summary.innerHTML='<div class="eyebrow" style="margin-top:32px">TOTAL FAMILY ASSETS</div><div class="total">HK$ 152,800,000,000</div><span class="positive">▲ +3.82% 本季度（模拟）</span>';content.appendChild(summary)}let grid=document.createElement('div');grid.className='cards';p.cards.forEach(([name,value,detail])=>{let c=document.createElement('div');c.className='card';let a=document.createElement('small');a.textContent=name;let h=document.createElement('h2');h.textContent=value;let d=document.createElement('p');d.textContent=detail;c.append(a,h,d);grid.appendChild(c)});content.appendChild(grid)}document.getElementById('lock').onclick=()=>{show(5);let n=document.getElementById('notice');n.style.display='block';n.scrollIntoView({behavior:'smooth',block:'nearest'})};show(0);
const entry=document.getElementById('entry'),panel=entry.querySelector('.entry-panel'),statusEl=document.getElementById('entry-status'),descEl=document.getElementById('entry-desc'),actionsEl=document.getElementById('entry-actions');
function dismissEntry(){entry.classList.add('hidden');setTimeout(()=>entry.remove(),800)}
document.getElementById('entry-no').onclick=dismissEntry;
document.getElementById('entry-yes').onclick=()=>{actionsEl.style.display='none';panel.classList.add('scanning');document.getElementById('entry-progress').style.display='block';requestAnimationFrame(()=>document.getElementById('entry-bar').style.width='100%');descEl.textContent='正在建立加密连接并核验演示访问权限…';statusEl.textContent='VERIFYING IDENTITY · 0%';setTimeout(()=>statusEl.textContent='CHECKING DEVICE · 48%',1500);setTimeout(()=>{panel.classList.remove('scanning');statusEl.textContent='ACCESS GRANTED · DEMO MODE';descEl.textContent='演示身份已确认。正在进入裴氏家族私人资产终端。';},3400);setTimeout(dismissEntry,4600)};

</script></body></html>
